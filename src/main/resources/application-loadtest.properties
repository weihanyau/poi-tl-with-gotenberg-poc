# Load-testing profile. Activate with: SPRING_PROFILES_ACTIVE=loadtest
# (the docker-compose.loadtest.yml stack sets `docker,loadtest`).

# Webhook callbacks arrive on Tomcat request threads and compete with the driver's
# own outbound calls. The default of 200 throttles high-concurrency webhook runs.
server.tomcat.threads.max=400
server.tomcat.accept-count=500

# Templates and PDFs both exceed the 10MB default used by the single-document endpoint.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Connection pool must be at least as large as the run concurrency, otherwise threads
# queue on the pool and the recorded latency measures our own contention.
loadtest.http.max-total=512
loadtest.http.max-per-route=512
loadtest.http.connect-timeout-seconds=10
loadtest.http.response-timeout-seconds=600
loadtest.http.connection-request-timeout-seconds=600

# Base URL Gotenberg calls back on. Must resolve from inside the Gotenberg container:
#   app in compose  -> http://docx-service:8080
#   app on the host -> http://host.docker.internal:8080
loadtest.webhook.base-url=http://host.docker.internal:8080

loadtest.results-dir=./loadtest-results
loadtest.job-timeout-seconds=600
loadtest.run-timeout-seconds=7200

# Per-request logging would itself become a bottleneck at 10k conversions.
logging.level.com.example.docxpoc=INFO
logging.level.com.example.docxpoc.loadtest=INFO
