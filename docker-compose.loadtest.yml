# Load-testing stack: N Gotenberg replicas behind an nginx round-robin proxy.
#
# A single Gotenberg container converts one document at a time: at 1 replica it pins to
# ~103% CPU, i.e. exactly one core. That is why there is no --libreoffice-max-concurrency
# flag (Chromium has one, LibreOffice does not) and why replicas are the only way to
# convert in parallel.
#
# Measured on a 10-CPU Docker VM: 1 replica 2.06/s, 2 -> 3.80/s, 4 -> 6.24/s,
# 8 -> 7.70/s, 12 -> 6.96/s. Gains fall off after 4 and reverse after 8. Scale
# concurrency alongside replicas, roughly 2x. Measure on your own host.
#
#   docker compose -f docker-compose.loadtest.yml up --build
#   GOTENBERG_REPLICAS=12 docker compose -f docker-compose.loadtest.yml up --build

services:
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      # Default is 30s, which a queued conversion will blow through under load and
      # report as a failure rather than as backpressure.
      - --api-timeout=300s
      - --api-body-limit=100MB
      - --libreoffice-auto-start=true
      # Gotenberg's default of 10. Restarting LibreOffice every 10 conversions costs
      # throughput, but it is what production runs on, so measure it. Set
      # GOTENBERG_RESTART_AFTER=0 to disable restarts and isolate the conversion cost.
      - --libreoffice-restart-after=${GOTENBERG_RESTART_AFTER:-10}
      # Default is 4 retries, which would deliver the same PDF several times and
      # inflate the conversion count.
      - --webhook-max-retry=1
      - --webhook-client-timeout=120s
      # Set GOTENBERG_LOG_LEVEL=info to log every request, which lets you count how many
      # each replica served and verify the load is actually being distributed.
      - --log-level=${GOTENBERG_LOG_LEVEL:-error}
    # No host port binding: replicas cannot share one.
    # 8 measured fastest on a 10-CPU host (7.70/s); 12 regressed. Roughly one replica per
    # host CPU is the ceiling -- see the replica sweep in the README.
    deploy:
      replicas: ${GOTENBERG_REPLICAS:-8}
    restart: unless-stopped

  gotenberg-lb:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gotenberg
    restart: unless-stopped

  docx-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker,loadtest
      # Set GOTENBERG_URL=http://gotenberg:3000 to bypass nginx and rely on Docker's
      # own DNS round-robin instead. See the README on why that distributes poorly.
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg-lb:3000}
      # Gotenberg resolves this from inside its own container, not from the host.
      - LOADTEST_WEBHOOK_BASE_URL=http://docx-service:8080
    volumes:
      # Results are written inside the container; mount them out so they survive it.
      - ./loadtest-results:/app/loadtest-results
    depends_on:
      - gotenberg-lb
    restart: unless-stopped
