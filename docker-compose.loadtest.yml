# Load-testing stack: N Gotenberg replicas behind an nginx round-robin proxy.
#
# Gotenberg exposes no --libreoffice-max-concurrency flag (unlike Chromium), but a
# single container is NOT serialised: measured on a 10-CPU Docker VM with the
# 100-document smoke template at concurrency=20, 1 replica gave 7.6 conversions/s and
# 4 replicas gave 21.1/s. Scaling helps, but sub-linearly -- past roughly one replica
# per 2 host CPUs the replicas just contend for the same cores. Measure on your own
# host before assuming more replicas will help.
#
#   docker compose -f docker-compose.loadtest.yml up --build
#   GOTENBERG_REPLICAS=8 docker compose -f docker-compose.loadtest.yml up --build

services:
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      # Default is 30s, which a queued conversion will blow through under load and
      # report as a failure rather than as backpressure.
      - --api-timeout=300s
      - --api-body-limit=100MB
      - --libreoffice-auto-start=true
      # Default is 10: LibreOffice restarts every 10 conversions, and the restart cost
      # would otherwise dominate the measurement.
      - --libreoffice-restart-after=0
      # Default is 4 retries, which would deliver the same PDF several times and
      # inflate the conversion count.
      - --webhook-max-retry=1
      - --webhook-client-timeout=120s
      - --log-level=error
    # No host port binding: replicas cannot share one.
    deploy:
      replicas: ${GOTENBERG_REPLICAS:-4}
    restart: unless-stopped

  gotenberg-lb:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gotenberg
    restart: unless-stopped

  docx-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker,loadtest
      - GOTENBERG_URL=http://gotenberg-lb:3000
      # Gotenberg resolves this from inside its own container, not from the host.
      - LOADTEST_WEBHOOK_BASE_URL=http://docx-service:8080
    volumes:
      # Results are written inside the container; mount them out so they survive it.
      - ./loadtest-results:/app/loadtest-results
    depends_on:
      - gotenberg-lb
    restart: unless-stopped
