# Round-robins across the scaled `gotenberg` service.
#
# An `upstream` block resolves its server names once at startup, so it would pin to
# whichever replica existed first. Instead we put the target in a variable, which
# forces nginx to consult the resolver per request. Docker's embedded DNS at 127.0.0.11
# returns the replica addresses in rotating order, which is what distributes the load.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 3000;

        # Conversions are large; do not cap the upload.
        client_max_body_size 0;
        client_body_buffer_size 1m;

        location / {
            set $gotenberg gotenberg:3000;
            proxy_pass http://$gotenberg;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Must exceed Gotenberg's --api-timeout, or nginx returns 504 first and we
            # lose the server's own error response.
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Never silently resend a conversion to another replica: a retry would be
            # counted as one request but consume two conversions.
            proxy_next_upstream off;
        }
    }
}
